services:
  opencode:
    image: ghcr.io/anomalyco/opencode:1.14.20
    container_name: opencode
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROJECT_DIR}:/workspace
      - ./opencode-config:/root/.config/opencode
      - ./opencode-data:/root/.local/share/opencode
    working_dir: /workspace
    ports:
      - "3000:3000"   # Node/Next.js or custom frontend dev server
      - "4200:4200"   # Angular
      - "5000:5000"   # ASP.NET Core / Flask
      - "5173:5173"   # Vite
      - "8000:8000"   # Python API / Django / FastAPI
      - "8080:8080"   # Common backend or proxy port
    environment:
      - OPENCODE_CONFIG_DIR=/root/.config/opencode
      - OPENCODE_CONFIG=/root/.config/opencode/opencode.json
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
